# Render Blueprint: one free web service built from the Dockerfile. See docs/deploy.md.
services:
  - type: web
    name: sequence-board-game
    runtime: docker
    plan: free
    # Next to the Neon database (aws-us-east-2); a service can't change region once created.
    region: ohio
    branch: version-2
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Both from Neon (`neon env pull` writes them to .env.local): the pooled one (-pooler host) for the app,
      # the direct one for migrations, which hold a session-level advisory lock the pooler doesn't keep.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
